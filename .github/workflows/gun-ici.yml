name: BIST Radar - Gun Ici Tarama

on:
  schedule:
    - cron: '*/30 7-15 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gun-ici
  cancel-in-progress: true

jobs:
  gunici:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kurulum
        run: pip install yfinance pandas numpy
      - name: Gun ici taramayi calistir
        working-directory: canli-izleme
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py --gun-ici
      - name: Gun ici verisini kaydet
        run: |
          git config user.name "bist-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add intraday.json || true
          git diff --staged --quiet || git commit -m "Gun ici guncellendi"
          git push || true

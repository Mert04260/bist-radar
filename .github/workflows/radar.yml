name: BIST Radar - Sabah Taramasi

on:
  schedule:
    - cron: '30 4 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kurulum
        run: pip install yfinance pandas numpy
      - name: Radari calistir
        working-directory: canli-izleme
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py
      - name: Karneyi kaydet
        run: |
          git config user.name "bist-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add canli-izleme/signals.csv || true
          git diff --staged --quiet || git commit -m "Karne guncellendi"
          git push || true

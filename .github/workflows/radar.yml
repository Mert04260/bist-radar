name: MERT RADAR

on:
  schedule:
    - cron: "20 15 * * 1-5"
    - cron: "*/20 7-15 * * 1-5"
  workflow_dispatch:
    inputs:
      mod:
        description: "gun-sonu | gun-ici | backtest | anomali-karne"
        default: "gun-sonu"

permissions:
  contents: write

jobs:
  kos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r canli-izleme/requirements.txt

      - uses: actions/cache@v4
        with:
          path: canli-izleme/onbellek
          key: radar-onbellek-${{ github.run_id }}
          restore-keys: radar-onbellek-

      - name: Modu belirle
        id: mod
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mod=${{ inputs.mod }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "20 15 * * 1-5" ]; then
            echo "mod=gun-sonu" >> $GITHUB_OUTPUT
          else
            echo "mod=gun-ici" >> $GITHUB_OUTPUT
          fi

      - name: Radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python canli-izleme/mert_radar.py ${{ steps.mod.outputs.mod }}

      - name: Sonuclari commitle
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          for f in data.json intraday.json backtest.json \
                   canli-izleme/signals.csv \
                   canli-izleme/anomali_arsiv.csv \
                   canli-izleme/intraday_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git status --short
          git diff --staged --quiet && echo "degisiklik yok" && exit 0
          git commit -m "radar: ${{ steps.mod.outputs.mod }}"
          git pull --rebase --autostash
          git push

name: MERT RADAR

on:
  schedule:
    - cron: "20 15 * * 1-5"          # gun sonu (18:20 TRT)
    - cron: "*/20 7-15 * * 1-5"      # gun ici (10:00-18:00 TRT arasi 20 dk)
  workflow_dispatch:
    inputs:
      mod:
        description: "gun-sonu | gun-ici | backtest | anomali-karne"
        default: "gun-sonu"

permissions:
  contents: write

jobs:
  kos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r canli-izleme/requirements.txt

      # Fiyat onbellegi: kaybolursa sistem calisir, sadece ilk kosu yavaslar
      - uses: actions/cache@v4
        with:
          path: canli-izleme/onbellek
          key: radar-onbellek-${{ github.run_id }}
          restore-keys: radar-onbellek-

      - name: Modu belirle
        id: mod
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mod=${{ inputs.mod }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "20 15 * * 1-5" ]; then
            echo "mod=gun-sonu" >> $GITHUB_OUTPUT
          else
            echo "mod=gun-ici" >> $GITHUB_OUTPUT
          fi

      - name: Radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python canli-izleme/mert_radar.py ${{ steps.mod.outputs.mod }}

      # signals.csv ve anomali_arsiv.csv kalici olmali - sistemin hafizasi bunlar
      - name: Sonuclari commit'le
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data.json intraday.json backtest.json \
                     canli-izleme/signals.csv \
                     canli-izleme/anomali_arsiv.csv \
                     canli-izleme/intraday_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "radar: ${{ steps.mod.outputs.mod }} $(date -u +%F\ %H:%M)"
          git pull --rebase --autostash || true
          git push || true
